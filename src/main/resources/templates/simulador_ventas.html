<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <title>Simulador de Ventas - Veterinaria Patitas</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Meta con username desde sesión, usado por el JS para imprimir el cliente en la boleta -->
    <meta name="username" th:if="${session.usuarioLogeado != null}" th:content="${session.usuarioLogeado}" />
</head>
<body>
    <header>
        <div th:replace="fragments/navbar :: navbar"></div>
    </header>

    <div id="app" class="container-fluid">
        <div class="main-content-box mx-auto p-4 p-md-5 my-5" style="max-width: 1200px;">
            <header class="text-center mb-5 py-5">
                <h1 class="display-5 fw-bolder text-dark text-uppercase">Adquiere tu producto</h1>
            </header>

            <!-- Muestra un mensaje de fallo o de exito si el controlador solicita un mensaje-->
            <div th:if="${message}" id="notification" 
                 th:classappend="${#strings.contains(message, 'Error') ? 'alert-danger' : 'alert-success'}"
                 class="alert mx-auto mb-4" role="alert" style="max-width: 1140px;">
                <p th:text="${message}" class="mb-0 fw-bold"></p>
            </div>

            <div class="row mx-auto" style="max-width: 1140px;">
                <!-- Catálogo de Productos -->
                <section class="col-lg-8 mb-4">
                    <h2 class="h4 fw-bold mb-4 text-secondary">
                        <i class="fa-solid fa-list-ul me-2 text-patitas"></i>Catálogo de Productos
                    </h2>
                    <!-- itera por la lista de productos y busca por su nombre-->
                    <div id="product-list" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                        <div th:each="product : ${products}" class="col">
                            <div th:id="|product-card-${product.id}|"
                                 th:class="|card h-100 card-product shadow-sm border-start border-5 ${product.stock > 0 ? 'border-patitas' : 'border-secondary'}|">
                                <div class="card-body">
                                    <h3 class="card-title h5 fw-bold" th:text="${product.name}"></h3>
                                    <p class="card-text display-6 fw-bolder text-patitas mb-1"
                                       th:if="${product.currency == 'USD'}"
                                       th:text="|US$ ${#numbers.formatDecimal(product.price, 1, 2)}|"></p>
                                    <p class="card-text display-6 fw-bolder text-patitas mb-1"
                                       th:if="${product.currency != 'USD'}"
                                       th:text="|S/. ${#numbers.formatDecimal(product.price, 1, 2)}|"></p>
                                    <p class="card-text text-muted mb-3" th:if="${product.currency == 'USD'}"
                                       th:text="|Referencia en soles: S/. ${#numbers.formatDecimal(product.pricePen != null ? product.pricePen : 0, 1, 2)}|"></p>
                                    <p class="card-text text-muted mb-3" th:text="|Unidad: ${product.unit}|"></p>
                                    <!-- añade el producto al scarrito y descuenta el stock-->
                                    <form th:action="@{/add_to_cart}" method="post">
                                        <input type="hidden" name="productId" th:value="${product.id}" />
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <span th:id="|stock-${product.id}|"
                                                th:class="|badge p-2 ${product.stock > 0 ? 'text-bg-success' : 'text-bg-danger stock-agotado'}|"
                                                th:text="|Stock: ${product.stock}|">
                                            </span>
                                            <input type="number" name="quantity" value="1" min="1" 
                                                th:max="${product.stock}" th:disabled="${product.stock <= 0}"
                                                class="form-control w-auto text-center" style="max-width: 80px;">
                                        </div>
                                        <!-- VALIDA QUE EL STOCK NO ESTE EN 0 PARA AÑADIR AL CARRITO-->
                                        <button type="submit" th:disabled="${product.stock <= 0}"
                                            class="w-100 btn btn-patitas btn-sm shadow-sm">
                                            <i class="fa-solid fa-plus me-1"></i> Añadir al Carrito
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Carrito de Compras -->
                <aside class="col-lg-4">
                    <div class="card shadow-lg border-top border-5 border-patitas">
                        <div class="card-body p-4">
                            <h2 class="card-title h4 fw-bold mb-4 text-secondary">
                                <i class="fa-solid fa-cart-shopping me-2 text-warning"></i>Carrito de Compras
                            </h2>
                            <!-- Muestra la lista del carrito-->
                            <div id="cart-items" class="border-bottom pb-3 mb-3">
                                <p th:if="${#lists.isEmpty(cart)}" id="empty-cart-message" 
                                   class="text-secondary fst-italic text-center py-4">
                                    El carrito está vacío.
                                </p>
                                
                                <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(cart)}">
                                    <li th:each="item : ${cart}" 
                                        class="list-group-item d-flex justify-content-between align-items-center bg-light rounded mb-2 border-0">
                                        <div>
                                            <p class="fw-semibold text-dark mb-0" th:text="${item.name}"></p>
                                            <p class="text-sm text-muted mb-0" th:if="${item.currency == 'USD'}"
                                               th:text="|${item.quantity} x US$ ${#numbers.formatDecimal(item.price, 1, 2)} (S/. ${#numbers.formatDecimal(item.pricePen != null ? item.pricePen : 0, 1, 2)} c/u)|"></p>
                                            <p class="text-sm text-muted mb-0" th:if="${item.currency != 'USD'}"
                                               th:text="|${item.quantity} x S/. ${#numbers.formatDecimal(item.pricePen != null ? item.pricePen : item.price, 1, 2)}|"></p>
                                        </div>
                                        <!-- Remueve el producto del cuento-->
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="fw-bold text-patitas me-2" 
                                                  th:text="|S/. ${#numbers.formatDecimal((item.pricePen != null ? item.pricePen : item.price) * item.quantity, 1, 2)}|"></span>
                                            <form th:action="@{/remove_from_cart}" method="post" style="display:inline;">
                                                <input type="hidden" name="productId" th:value="${item.id}" />
                                                <button type="submit" class="btn btn-sm text-danger p-0 border-0" title="Eliminar">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <!-- Totales -->
                            <div id="cart-totals">
                                <div class="d-flex justify-content-between py-1 text-secondary">
                                    <span>Subtotal:</span>
                                    <span id="subtotal" class="fw-bold" 
                                          th:text="|S/. ${#numbers.formatDecimal(subtotal, 1, 2)}|">S/. 0.00</span>
                                </div>
                                <div class="d-flex justify-content-between py-1 text-secondary">
                                    <span>IGV (18%):</span>
                                    <span id="tax" class="fw-bold" 
                                          th:text="|S/. ${#numbers.formatDecimal(tax, 1, 2)}|">S/. 0.00</span>
                                </div>
                                <div class="d-flex justify-content-between py-2 border-top mt-2 fs-5 fw-bolder text-dark">
                                    <span>Total a Pagar:</span>
                                    <span id="total" 
                                          th:text="|S/. ${#numbers.formatDecimal(total, 1, 2)}|">S/. 0.00</span>
                                </div>
                            </div>

                            <div id="exchange-rate-box" class="alert alert-light border mt-3 mb-0">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-semibold text-secondary">Tipo de cambio (USD)</span>
                                    <small id="exchange-rate-date" class="text-muted"></small>
                                </div>
                                <div id="exchange-rate-content" class="small text-muted mt-2">
                                    Cargando tipo de cambio...
                                </div>
                            </div>
                            
                            <!-- Botones de Acción -->
                            <form th:action="@{/finalize_sale}" method="post" class="mt-4">
                                <button type="submit" id="checkout-button" 
                                        th:disabled="${#lists.isEmpty(cart)}"
                                        class="w-100 btn btn-patitas fw-bold py-3 shadow-sm d-flex align-items-center justify-content-center">
                                    <i class="fa-solid fa-file-invoice me-2"></i>Confirmar Venta
                                </button>
                            </form>
                            
                            <form th:action="@{/clear_cart}" method="post" class="mt-2">
                                <button type="submit" id="clear-cart-button"
                                        class="w-100 btn btn-danger fw-bold py-2 d-flex align-items-center justify-content-center">
                                    <i class="fa-solid fa-trash-can me-2"></i>Vaciar Carrito
                                </button>
                            </form>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <!-- Contenedor oculto para datos de la venta -->
    <!-- usa la lista de respaldo de flashcard con los items que tiene -->
    <div id="final-cart-data" style="display:none;" th:if="${finalCart != null}">
        <ul id="final-cart-list">
            <li th:each="item : ${finalCart}"
                th:data-name="${item['name']}"
                th:data-price="${item['price']}"
                th:data-quantity="${item['quantity']}"></li>
        </ul>
    </div>

    <!-- Botón visible para descargar la boleta manualmente (útil para probar y depurar) -->
    <!-- Botón flotante ligeramente elevado para no quedar tapado por el footer -->
    <div th:if="${finalCart != null}" class="mx-auto text-center my-3" 
         style="max-width:1140px; position:fixed; left:50%; transform:translateX(-50%); bottom:80px; z-index:1050;">
        <button id="download-invoice-button"
                class="btn btn-success">
            <i class="fa-solid fa-file-pdf me-2"></i> Descargar Boleta
        </button>
        
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

    <script>
        function parseCurrency(text) {
            if (!text) return 0;
            let normalized = text
                .replace("S/.", "")
                .replace("S/", "")
                .replace(/\s/g, "")
                .replace(/[^0-9,.-]/g, "");

            const hasComma = normalized.includes(",");
            const hasDot = normalized.includes(".");

            if (hasComma && hasDot) {
                // Usa como separador decimal el último símbolo que aparezca.
                if (normalized.lastIndexOf(",") > normalized.lastIndexOf(".")) {
                    normalized = normalized.replace(/\./g, "").replace(",", ".");
                } else {
                    normalized = normalized.replace(/,/g, "");
                }
            } else if (hasComma) {
                // Formato tipo 105,02
                normalized = normalized.replace(/\./g, "").replace(",", ".");
            } else {
                // Formato tipo 105.02 o entero
                normalized = normalized.replace(/,/g, "");
            }

            const value = Number.parseFloat(normalized);
            return Number.isFinite(value) ? value : 0;
        }

        function buildFinalCartPayload() {
            const finalCartElement = document.getElementById("final-cart-data");
            if (!finalCartElement) return [];

            const listItems = finalCartElement.querySelectorAll("#final-cart-list li");
            if (!listItems || listItems.length === 0) return [];

            return Array.from(listItems).map(li => ({
                name: li.getAttribute("data-name") || "",
                price: parseFloat(li.getAttribute("data-price")) || 0,
                quantity: parseInt(li.getAttribute("data-quantity"), 10) || 0
            }));
        }

        async function generateInvoicePDF() {
            const items = buildFinalCartPayload();
            if (!items.length) {
                alert("No hay datos de boleta para descargar.");
                return;
            }

            const subtotal = parseCurrency(document.getElementById("subtotal")?.textContent);
            const tax = parseCurrency(document.getElementById("tax")?.textContent);
            const total = parseCurrency(document.getElementById("total")?.textContent);
            const username = document.querySelector('meta[name="username"]')?.getAttribute("content") || "Cliente General";

            const payload = { items, subtotal, tax, total, username };

            try {
                const response = await fetch("/invoice/download", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error("No se pudo generar la boleta en el servidor.");
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `Boleta_PatitasVet_${Date.now()}.pdf`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error(error);
                alert("Error al descargar la boleta: " + (error.message || "intenta nuevamente"));
            }
        }

        async function loadExchangeRate() {
            const content = document.getElementById('exchange-rate-content');
            const dateElement = document.getElementById('exchange-rate-date');
            if (!content || !dateElement) return;

            try {
                let payload = null;
                const today = new Date();

                for (let i = 0; i < 7; i++) {
                    const requestDate = new Date(today);
                    requestDate.setDate(today.getDate() - i);
                    const fecha = requestDate.toISOString().slice(0, 10);

                    const response = await fetch('/api/public/tipo-cambio', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fecha })
                    });
                    const candidate = await response.json();
                    if (response.ok && candidate.success) {
                        payload = candidate;
                        break;
                    }
                }

                if (!payload || !payload.success) {
                    throw new Error('No se pudo consultar el tipo de cambio reciente.');
                }

                const data = payload.data || {};
                const compraValue = Number(data.compra);
                const ventaValue = Number(data.venta);
                const compra = Number.isFinite(compraValue) ? compraValue.toFixed(3) : 'N/D';
                const venta = Number.isFinite(ventaValue) ? ventaValue.toFixed(3) : 'N/D';

                content.textContent = `Compra: S/ ${compra} | Venta: S/ ${venta}`;
                dateElement.textContent = data.fecha ? `Fecha: ${data.fecha}` : '';
            } catch (error) {
                content.textContent = error.message || 'Tipo de cambio no disponible.';
                dateElement.textContent = '';
            }
        }

        
        // verifica que el boton exita para despues agregar el listener
        const btn = document.getElementById('download-invoice-button');
        if (btn) {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                generateInvoicePDF();
            });
        } else {
            console.log('Botón de descarga no presente. Si existe finalCart, recarga la página y revisa la consola.');
        }

        loadExchangeRate();
    </script>

    <footer>
        <p>&copy; 2025 Veterinaria PATITAS. Todos los derechos reservados.</p>
    </footer>
    <script th:src="@{/js/navbar_logic.js}"></script>
</body>
</html>
