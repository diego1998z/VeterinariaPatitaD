<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="mb-4">Recuperar Contraseña</h2>

                    <div th:if="${message}" class="alert" th:classappend="|alert-${messageType}|">
                        <span th:text="${message}"></span>
                    </div>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Usuario o correo</label>
                            <input type="text" name="identifier" class="form-control" required>
                            <div class="form-text">El usuario debe tener correo registrado para poder recibir el enlace.</div>
                        </div>
                        <div class="d-grid d-sm-flex gap-2">
                            <button type="submit" class="btn btn-primary">Enviar código</button>
                            <a th:href="@{/login}" class="btn btn-outline-secondary">Volver al login</a>
                        </div>
                    </form>

                    <div th:if="${showResetButton}" class="d-grid mt-3">
                        <a th:href="@{/reset-password(identifier=${identifier})}" class="btn btn-success">Ingresar código y restablecer</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
