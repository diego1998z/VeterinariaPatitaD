<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="container mt-5">
<h2 class="mb-4">Recuperar Contraseña</h2>

<div th:if="${message}" class="alert" th:classappend="|alert-${messageType}|">
    <span th:text="${message}"></span>
</div>

<form th:action="@{/forgot-password}" method="post" class="w-50">
    <div class="mb-3">
        <label class="form-label">Usuario o correo</label>
        <input type="text" name="identifier" class="form-control" required>
        <div class="form-text">El usuario debe tener correo registrado para poder recibir el enlace.</div>
    </div>
    <button type="submit" class="btn btn-primary">Enviar codigo</button>
    <a th:href="@{/login}" class="btn btn-outline-secondary ms-2">Volver al login</a>
</form>

<div th:if="${showResetButton}" class="mt-3">
    <a th:href="@{/reset-password(identifier=${identifier})}" class="btn btn-success">Ingresar codigo y restablecer</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
