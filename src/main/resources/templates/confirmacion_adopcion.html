<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de adopción recibida</title>
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>
<main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm text-center" style="max-width: 680px;">
        <div class="card-body p-4 p-md-5">
            <i class="fa-solid fa-circle-check fa-4x text-success mb-3" aria-hidden="true"></i>
            <h1 class="h2">¡Solicitud recibida!</h1>
            <p class="lead">
                Registramos tu interés en adoptar a <strong th:text="${solicitud.petName}">la mascota</strong>.
            </p>
            <p>El equipo revisará la información y se comunicará con vos mediante los datos proporcionados.</p>
            <p class="text-secondary mb-4">
                Código de solicitud: <strong th:text="|ADP-${solicitud.id}|">ADP-1</strong>
            </p>
            <div class="d-grid d-sm-flex gap-2 justify-content-sm-center">
                <a th:href="@{/adoptar}" class="btn btn-primary btn-lg">Ver otras mascotas</a>
                <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">Ir al inicio</a>
            </div>
        </div>
    </div>
</main>
<footer>
    <p>&copy; 2025 Veterinaria PATITAS. Todos los derechos reservados.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
