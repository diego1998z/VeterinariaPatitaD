<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <title>Gestión de Médicos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<header>
    <div th:replace="fragments/navbar :: navbar"></div>
</header>

<div class="container-fluid">
    <div class="main-content-box mx-auto p-4 p-md-5 my-5" style="max-width: 1150px;">
        <header class="text-center mb-4">
            <h1 class="display-6 fw-bolder text-uppercase">Gestión de Médicos</h1>
            <p class="text-secondary mb-0">CRUD de médicos y asignación a servicios</p>
        </header>

        <div th:if="${message}" class="alert mx-auto mb-4"
             th:classappend="|alert-${messageType}|">
            <span th:text="${message}"></span>
        </div>

        <div class="row g-4">
            <!-- Formulario -->
            <section class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Registrar / Editar</h2>
                        <form th:action="@{/admin/medicos/guardar}" method="post">
                            <input type="hidden" name="id" th:value="${medicoForm.id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre</label>
                                <input type="text" class="form-control" name="nombre"
                                       th:value="${medicoForm.nombre}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Especialidad</label>
                                <input type="text" class="form-control" name="especialidad"
                                       th:value="${medicoForm.especialidad}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Horario Inicio</label>
                                <input type="time" class="form-control" name="horarioInicio"
                                       th:value="${medicoForm.horarioInicio != null ? #temporals.format(medicoForm.horarioInicio, 'HH:mm') : ''}"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Horario Fin</label>
                                <input type="time" class="form-control" name="horarioFin"
                                       th:value="${medicoForm.horarioFin != null ? #temporals.format(medicoForm.horarioFin, 'HH:mm') : ''}"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Servicio</label>
                                <select class="form-select" name="servicioId">
                                    <option value="">Seleccione servicio</option>
                                    <option th:each="s : ${services}"
                                            th:value="${s.id}"
                                            th:text="${s.name}"
                                            th:selected="${selectedServiceId != null and s.id == selectedServiceId}">
                                    </option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-patitas w-100 fw-bold">
                                <span th:text="${medicoForm.id != null ? 'Actualizar' : 'Registrar'}"></span>
                            </button>
                            <a th:if="${medicoForm.id != null}" th:href="@{/admin/medicos}"
                               class="btn btn-outline-secondary w-100 mt-2">
                                Cancelar edición
                            </a>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Tabla -->
            <section class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Listado de Médicos</h2>

                        <form class="row g-2 mb-3" method="get" th:action="@{/admin/medicos}">
                            <div class="col-md-6">
                                <select class="form-select" name="especialidad">
                                    <option value="">Todas las especialidades</option>
                                    <option th:each="e : ${especialidades}"
                                            th:value="${e}"
                                            th:text="${e}"
                                            th:selected="${especialidadFiltro != null and e == especialidadFiltro}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button type="submit" class="btn btn-outline-primary w-100">Filtrar</button>
                            </div>
                            <div class="col-md-3">
                                <a class="btn btn-outline-secondary w-100" th:href="@{/admin/medicos}">
                                    Limpiar
                                </a>
                            </div>
                        </form>

                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Especialidad</th>
                                    <th>Horario</th>
                                    <th>Fecha</th>
                                    <th>Servicio</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="m : ${medicos}">
                                    <td th:text="${m.id}"></td>
                                    <td th:text="${m.nombre}"></td>
                                    <td th:text="${m.especialidad}"></td>
                                    <td th:text="|${#temporals.format(m.horarioInicio, 'HH:mm')} - ${#temporals.format(m.horarioFin, 'HH:mm')}|"></td>
                                    <td th:text="${m.fechaHorario != null ? #temporals.format(m.fechaHorario, 'dd-MM-yyyy') : '-'}"></td>
                                    <td th:text="${m.servicioNombre != null ? m.servicioNombre : 'Sin servicio'}"></td>
                                    <td>
                                        <a class="btn btn-sm btn-warning"
                                           th:href="@{/admin/medicos/editar/{id}(id=${m.id})}">
                                            Editar
                                        </a>
                                        <a class="btn btn-sm btn-info text-white"
                                           th:href="@{/admin/medicos/{id}/horarios(id=${m.id})}">
                                            Horarios
                                        </a>
                                        <form th:action="@{/admin/medicos/eliminar/{id}(id=${m.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/navbar_logic.js}"></script>
</body>
</html>
