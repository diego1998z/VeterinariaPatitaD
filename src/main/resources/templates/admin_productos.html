<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <title>Gestión de Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<header>
    <div th:replace="fragments/navbar :: navbar"></div>
</header>

<div class="container-fluid">
    <div class="main-content-box mx-auto p-4 p-md-5 my-5" style="max-width: 1100px;">
        <header class="text-center mb-4">
            <h1 class="display-6 fw-bolder text-uppercase">Gestión de Productos</h1>
            <p class="text-secondary mb-0">CRUD de productos de la tienda</p>
        </header>

        <div th:if="${message}" class="alert mx-auto mb-4"
             th:classappend="|alert-${messageType}|">
            <span th:text="${message}"></span>
        </div>

        <div class="row g-4">
            <!-- Formulario -->
            <section class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Registrar / Editar</h2>
                        <form th:action="@{/admin/productos/guardar}" th:object="${productForm}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre</label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Precio base</label>
                                <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Moneda</label>
                                <select class="form-select" th:field="*{currency}" required>
                                    <option value="PEN">PEN (S/)</option>
                                    <option value="USD">USD ($)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Stock</label>
                                <input type="number" min="0" class="form-control" th:field="*{stock}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Unidad</label>
                                <input type="text" class="form-control" th:field="*{unit}" placeholder="Ej: unidad, caja">
                            </div>

                            <button type="submit" class="btn btn-patitas w-100 fw-bold">
                                <span th:text="${productForm.id != 0 ? 'Actualizar' : 'Registrar'}"></span>
                            </button>
                            <a th:if="${productForm.id != 0}" th:href="@{/admin/productos}"
                               class="btn btn-outline-secondary w-100 mt-2">
                                Cancelar edición
                            </a>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Tabla -->
            <section class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Listado de Productos</h2>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Moneda</th>
                                    <th>Stock</th>
                                    <th>Unidad</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="p : ${products}">
                                    <td th:text="${p.id}"></td>
                                    <td class="fw-semibold" th:text="${p.name}"></td>
                                    <td>
                                        <span th:if="${p.currency == 'USD'}"
                                              th:text="|US$ ${#numbers.formatDecimal(p.price, 1, 2)}|"></span>
                                        <span th:if="${p.currency != 'USD'}"
                                              th:text="|S/. ${#numbers.formatDecimal(p.price, 1, 2)}|"></span>
                                    </td>
                                    <td th:text="${p.currency}"></td>
                                    <td th:text="${p.stock}"></td>
                                    <td th:text="${p.unit}"></td>
                                    <td>
                                        <a class="btn btn-sm btn-warning"
                                           th:href="@{/admin/productos/editar/{id}(id=${p.id})}">
                                            Editar
                                        </a>
                                        <form th:action="@{/admin/productos/eliminar/{id}(id=${p.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/navbar_logic.js}"></script>
</body>
</html>
