<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/citas.css}">
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <title>Gestión de Citas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<header>
    <div th:replace="fragments/navbar :: navbar"></div>
</header>

<div class="container-fluid">
    <div class="main-content-box mx-auto p-4 p-md-5 my-5" style="max-width: 1200px;">
        <header class="text-center mb-4">
            <h1 class="display-6 fw-bolder text-uppercase">Gestión de Citas</h1>
            <p class="text-secondary mb-0">CRUD de citas con filtros en cascada</p>
        </header>

        <div th:if="${message}" class="alert mx-auto mb-4"
             th:classappend="|alert-${messageType}|">
            <span th:text="${message}"></span>
        </div>

        <div class="row g-4">
            <!-- Formulario -->
            <section class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Registrar / Editar</h2>
                        <form th:action="@{/admin/citas/guardar}" method="post" class="p-2">
                            <input type="hidden" name="id" th:value="${editId}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre</label>
                                <input type="text" class="form-control" name="clientName"
                                       th:value="${clientName}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Servicio</label>
                                <select id="serviceId" name="serviceId" class="form-select" required>
                                    <option value="">Seleccione un servicio</option>
                                    <option th:each="service : ${availableServices}"
                                            th:value="${service.id}"
                                            th:text="${service.name} + ' (' + ${service.duration} + ' - S/. ' + ${#numbers.formatDecimal(service.price, 1, 2)} + ')'"
                                            th:selected="${selectedServiceId != null and service.id == selectedServiceId}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Médico</label>
                                <select id="medicoId" name="medicoId" class="form-select" required
                                        th:attr="data-selected-id=${selectedMedicoId}">
                                    <option value="">Seleccione un médico</option>
                                    <option th:each="med : ${allMedicos}"
                                            th:value="${med.id}"
                                            th:text="${med.nombre} + ' - ' + ${med.especialidad} + ' (' + ${#temporals.format(med.horarioInicio,'HH:mm')} + ' - ' + ${#temporals.format(med.horarioFin,'HH:mm')} + ')'"
                                            th:attr="data-servicio-id=${med.servicio != null ? med.servicio.id : ''},
                                                     data-horario-inicio=${#temporals.format(med.horarioInicio,'HH:mm')},
                                                     data-horario-fin=${#temporals.format(med.horarioFin,'HH:mm')}"
                                            th:selected="${selectedMedicoId != null and med.id == selectedMedicoId}">
                                    </option>
                                </select>
                                <div class="form-text">Elige un servicio y una hora para filtrar médicos.</div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Fecha</label>
                                    <input type="date" class="form-control" id="date" name="date"
                                           th:value="${selectedDate}" th:min="${minDate}" required>
                                    <div class="form-text">Atención regular de lunes a viernes.</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Hora</label>
                                    <select id="time" name="time" class="form-select" required>
                                        <option value="">Seleccione hora</option>
                                        <option value="09:00" th:selected="${selectedTime == '09:00'}">09:00 AM</option>
                                        <option value="10:00" th:selected="${selectedTime == '10:00'}">10:00 AM</option>
                                        <option value="11:00" th:selected="${selectedTime == '11:00'}">11:00 AM</option>
                                        <option value="14:00" th:selected="${selectedTime == '14:00'}">02:00 PM</option>
                                        <option value="15:00" th:selected="${selectedTime == '15:00'}">03:00 PM</option>
                                        <option value="16:00" th:selected="${selectedTime == '16:00'}">04:00 PM</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-patitas w-100 fw-bold">
                                <span th:text="${editId != null ? 'Actualizar' : 'Registrar'}"></span>
                            </button>
                            <a th:if="${editId != null}" th:href="@{/admin/citas}"
                               class="btn btn-outline-secondary w-100 mt-2">
                                Cancelar edición
                            </a>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Tabla -->
            <section class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Listado de Citas (DTO)</h2>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Servicio</th>
                                    <th>Médico</th>
                                    <th>Fecha</th>
                                    <th>Hora</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c : ${appointmentList}">
                                    <td th:text="${c.id}"></td>
                                    <td th:text="${c.clientName}"></td>
                                    <td>
                                        <div class="fw-semibold" th:text="${c.serviceName}"></div>
                                        <small class="text-muted"
                                               th:text="|S/. ${#numbers.formatDecimal(c.servicePrice, 1, 2)}|"></small>
                                    </td>
                                    <td th:text="${c.medicoNombre != null ? c.medicoNombre : 'Sin médico'}"></td>
                                    <td th:text="${#temporals.format(c.dateTime, 'dd-MM-yyyy')}"></td>
                                    <td th:text="${#temporals.format(c.dateTime, 'HH:mm')}"></td>
                                    <td>
                                        <a class="btn btn-sm btn-warning"
                                           th:href="@{/admin/citas/editar/{id}(id=${c.id})}">
                                            Editar
                                        </a>
                                        <form th:action="@{/admin/citas/eliminar/{id}(id=${c.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const serviceSelect = document.getElementById('serviceId');
    const timeSelect = document.getElementById('time');
    const medicoSelect = document.getElementById('medicoId');
    const dateInput = document.getElementById('date');
    const submitBtn = document.querySelector('form button[type=\"submit\"]');
    if (!serviceSelect || !timeSelect || !medicoSelect || !dateInput) return;

    const selectedMedicoId = medicoSelect.dataset.selectedId;

    const originalOptions = Array.from(medicoSelect.options).map(o => ({
        value: o.value,
        text: o.text,
        servicioId: o.dataset.servicioId,
        inicio: o.dataset.horarioInicio,
        fin: o.dataset.horarioFin
    }));

    const toMinutes = str => {
        if (!str) return null;
        const [h, m] = str.split(':').map(n => parseInt(n, 10));
        return h * 60 + m;
    };

    const withinHorario = (horaSel, inicio, fin) => {
        if (!horaSel) return true;
        const h = toMinutes(horaSel);
        const i = toMinutes(inicio);
        const f = toMinutes(fin);
        if (i === null || f === null) return true;
        return h >= i && h <= f;
    };

    const isWeekend = dateValue => {
        if (!dateValue) return false;
        const day = new Date(`${dateValue}T00:00:00`).getDay();
        return day === 0 || day === 6;
    };

    const validateBusinessDay = () => {
        if (isWeekend(dateInput.value)) {
            dateInput.setCustomValidity('Seleccione una fecha de lunes a viernes.');
            return false;
        }
        dateInput.setCustomValidity('');
        return true;
    };

    const updateSubmitState = () => {
        const hasMedicos = medicoSelect.querySelectorAll('option').length > 1;
        const hasValidDate = validateBusinessDay();
        if (submitBtn) {
            submitBtn.disabled = !hasMedicos || !hasValidDate;
        }
    };

    function filterMedicos() {
        const service = serviceSelect.value;
        const hora = timeSelect.value;

        medicoSelect.innerHTML = '';
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Seleccione un médico';
        medicoSelect.appendChild(placeholder);

        originalOptions.forEach(opt => {
            if (!opt.value) return;
            if (service && opt.servicioId && opt.servicioId !== service) return;
            if (hora && !withinHorario(hora, opt.inicio, opt.fin)) return;

            const option = document.createElement('option');
            option.value = opt.value;
            option.textContent = opt.text;
            if (selectedMedicoId && option.value === selectedMedicoId) {
                option.selected = true;
            }
            medicoSelect.appendChild(option);
        });

        updateSubmitState();
    }

    serviceSelect.addEventListener('change', filterMedicos);
    timeSelect.addEventListener('change', filterMedicos);
    medicoSelect.addEventListener('change', updateSubmitState);
    dateInput.addEventListener('change', updateSubmitState);

    if (serviceSelect.value || timeSelect.value) {
        filterMedicos();
    } else {
        updateSubmitState();
    }
});
</script>

<script th:src="@{/js/navbar_logic.js}"></script>
</body>
</html>
