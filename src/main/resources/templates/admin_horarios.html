<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <title>Horarios del Médico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<header>
    <div th:replace="fragments/navbar :: navbar"></div>
</header>

<div class="container-fluid">
    <div class="main-content-box mx-auto p-4 p-md-5 my-5" style="max-width: 1100px;">
        <header class="text-center mb-4">
            <h1 class="display-6 fw-bolder text-uppercase">Horarios del Médico</h1>
            <p class="text-secondary mb-0"
               th:text="|${medico.nombre} - ${medico.especialidad}|"></p>
        </header>

        <div th:if="${message}" class="alert mx-auto mb-4"
             th:classappend="|alert-${messageType}|">
            <span th:text="${message}"></span>
        </div>

        <div class="row g-4">
            <!-- Formulario -->
            <section class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Registrar Horario</h2>
                        <form th:action="@{/admin/medicos/{id}/horarios/guardar(id=${medico.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Día de Semana</label>
                                <select class="form-select" name="diaSemana">
                                    <option value="">Seleccione día</option>
                                    <option th:each="d : ${daysOfWeek}"
                                            th:value="${d}"
                                            th:text="${dayNames[d.name()]}">
                                    </option>
                                </select>
                                <div class="form-text">Si eliges fecha específica, el día puede quedar vacío.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Fecha específica (opcional)</label>
                                <input type="date" class="form-control" name="fecha">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Hora Inicio</label>
                                <input type="time" class="form-control" name="horaInicio" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Hora Fin</label>
                                <input type="time" class="form-control" name="horaFin" required>
                            </div>

                            <button type="submit" class="btn btn-patitas w-100 fw-bold">
                                Registrar Horario
                            </button>
                            <a th:href="@{/admin/medicos}" class="btn btn-outline-secondary w-100 mt-2">
                                Volver a Médicos
                            </a>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Tabla -->
            <section class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Horarios Registrados</h2>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Día</th>
                                    <th>Fecha</th>
                                    <th>Inicio</th>
                                    <th>Fin</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="h : ${horarios}">
                                    <td th:text="${h.id}"></td>
                                    <td th:text="${h.diaSemana != null ? dayNames[h.diaSemana.name()] : '-'}"></td>
                                    <td th:text="${h.fecha != null ? #temporals.format(h.fecha, 'dd-MM-yyyy') : '-'}"></td>
                                    <td th:text="${#temporals.format(h.horaInicio, 'HH:mm')}"></td>
                                    <td th:text="${#temporals.format(h.horaFin, 'HH:mm')}"></td>
                                    <td>
                                        <form th:action="@{/admin/medicos/{medicoId}/horarios/eliminar/{horarioId}(medicoId=${medico.id}, horarioId=${h.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/navbar_logic.js}"></script>
</body>
</html>
