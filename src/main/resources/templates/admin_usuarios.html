<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <title>Gestión de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<header>
    <div th:replace="fragments/navbar :: navbar"></div>
</header>

<div class="container-fluid">
    <div class="main-content-box mx-auto p-4 p-md-5 my-5" style="max-width: 1100px;">
        <header class="text-center mb-4">
            <h1 class="display-6 fw-bolder text-uppercase">Gestión de Usuarios</h1>
            <p class="text-secondary mb-0">Crear usuarios y asignar rol CLIENTE o TRABAJADOR</p>
        </header>

        <div th:if="${message}" class="alert mx-auto mb-4"
             th:classappend="|alert-${messageType}|">
            <span th:text="${message}"></span>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Registrar / Editar</h2>
                        <form th:action="@{/admin/usuarios/guardar}" method="post">
                            <input type="hidden" name="id" th:value="${usuarioForm.id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Usuario</label>
                                <input type="text" class="form-control" name="usuario"
                                       th:value="${usuarioForm.usuario}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Correo</label>
                                <input type="email" class="form-control" name="email"
                                       th:value="${usuarioForm.email}" placeholder="usuario@correo.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Rol</label>
                                <select class="form-select" name="role" required>
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                            th:selected="${usuarioForm.role == r}"></option>
                                </select>
                                <div class="form-text">En este sistema, TRABAJADOR funciona como administrador.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Contraseña</label>
                                <input type="password" class="form-control" name="contrasena"
                                       th:attr="placeholder=${editMode} ? 'Opcional: solo para cambiar' : 'Mínimo 6 caracteres'">
                            </div>

                            <button type="submit" class="btn btn-patitas w-100 fw-bold">
                                <span th:text="${editMode} ? 'Actualizar usuario' : 'Registrar usuario'"></span>
                            </button>
                            <a th:if="${editMode}" th:href="@{/admin/usuarios}"
                               class="btn btn-outline-secondary w-100 mt-2">
                                Cancelar edición
                            </a>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Listado de Usuarios</h2>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Usuario</th>
                                    <th>Correo</th>
                                    <th>Rol</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="u : ${users}">
                                    <td th:text="${u.id}"></td>
                                    <td class="fw-semibold" th:text="${u.usuario}"></td>
                                    <td th:text="${u.email != null ? u.email : '-'}"></td>
                                    <td>
                                        <span class="badge text-bg-primary" th:if="${u.role == 'TRABAJADOR'}">TRABAJADOR</span>
                                        <span class="badge text-bg-secondary" th:if="${u.role != 'TRABAJADOR'}" th:text="${u.role}"></span>
                                    </td>
                                    <td>
                                        <a class="btn btn-sm btn-warning"
                                           th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}">
                                            Editar
                                        </a>
                                        <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/navbar_logic.js}"></script>
</body>
</html>
