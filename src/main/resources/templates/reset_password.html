<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="container mt-5">
<h2 class="mb-4">Restablecer Contraseña con Código</h2>

<div th:if="${message}" class="alert" th:classappend="|alert-${messageType}|">
    <span th:text="${message}"></span>
</div>

<form th:action="@{/reset-password}" method="post" class="w-50">
    <div class="mb-3">
        <label class="form-label">Usuario o correo</label>
        <input type="text" name="identifier" class="form-control" th:value="${identifier}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Código de recuperación</label>
        <input type="text" name="code" class="form-control" maxlength="6" pattern="[0-9]{6}" th:value="${code}" required>
        <div class="form-text">Ingresa el código de 6 dígitos recibido por correo.</div>
    </div>

    <div class="mb-3">
        <label class="form-label">Nueva contraseña</label>
        <input type="password" name="password" class="form-control" minlength="6" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Confirmar contraseña</label>
        <input type="password" name="confirmPassword" class="form-control" minlength="6" required>
    </div>
    <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
</form>

<a th:href="@{/forgot-password}" class="btn btn-outline-secondary mt-3">Solicitar nuevo código</a>
<a th:href="@{/login}" class="btn btn-outline-dark mt-3 ms-2">Ir al login</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
