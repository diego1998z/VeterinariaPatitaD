<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link rel="icon" th:href="@{/img/portadafondo.png}">
    <title>Gestión de Servicios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<header>
    <div th:replace="fragments/navbar :: navbar"></div>
</header>

<div class="container-fluid">
    <div class="main-content-box mx-auto p-4 p-md-5 my-5" style="max-width: 1100px;">
        <header class="text-center mb-4">
            <h1 class="display-6 fw-bolder text-uppercase">Gestión de Servicios</h1>
            <p class="text-secondary mb-0">CRUD de servicios veterinarios</p>
        </header>

        <div th:if="${message}" class="alert mx-auto mb-4"
             th:classappend="|alert-${messageType}|">
            <span th:text="${message}"></span>
        </div>

        <div class="row g-4">
            <!-- Formulario -->
            <section class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Registrar / Editar</h2>
                        <form th:action="@{/admin/servicios/guardar}" th:object="${serviceForm}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre</label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Descripción</label>
                                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Precio (S/.)</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Duración</label>
                                <input type="text" class="form-control" th:field="*{duration}" placeholder="Ej: 30min">
                            </div>

                            <button type="submit" class="btn btn-patitas w-100 fw-bold">
                                <span th:text="${serviceForm.id != null ? 'Actualizar' : 'Registrar'}"></span>
                            </button>
                            <a th:if="${serviceForm.id != null}" th:href="@{/admin/servicios}"
                               class="btn btn-outline-secondary w-100 mt-2">
                                Cancelar edición
                            </a>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Tabla -->
            <section class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 fw-bold text-secondary mb-3">Listado de Servicios</h2>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Servicio</th>
                                    <th>Precio</th>
                                    <th>Duración</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="s : ${services}">
                                    <td th:text="${s.id}"></td>
                                    <td>
                                        <div class="fw-semibold" th:text="${s.name}"></div>
                                        <small class="text-muted" th:text="${s.description}"></small>
                                    </td>
                                    <td th:text="|S/. ${#numbers.formatDecimal(s.price, 1, 2)}|"></td>
                                    <td th:text="${s.duration}"></td>
                                    <td>
                                        <a class="btn btn-sm btn-warning"
                                           th:href="@{/admin/servicios/editar/{id}(id=${s.id})}">
                                            Editar
                                        </a>
                                        <form th:action="@{/admin/servicios/eliminar/{id}(id=${s.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/navbar_logic.js}"></script>
</body>
</html>
