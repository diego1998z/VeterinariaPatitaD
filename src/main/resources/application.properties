spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/patitas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# Show SQL statements in the console
spring.jpa.show-sql=true
# Iniciar database on startup
spring.jpa.defer-datasource-initialization=true
# SQL initialization mode. Railway uses PostgreSQL and must not execute the
# local MySQL bootstrap script in init.sql.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
# Hibernate para MySQL
spring.jpa.properties.hibernate.format_sql=true
# El driver y dialecto se autodetectan segun SPRING_DATASOURCE_URL
# (MySQL local o PostgreSQL administrado en Railway).
server.port=${PORT:8081}

# JWT (secrets por variable de entorno)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:14400000}

# APIPeru
apiperu.base-url=${APIPERU_BASE_URL:https://apiperu.dev/api}
apiperu.token=${APIPERU_TOKEN:}

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# URL base para enlaces de recuperación
app.base-url=${APP_BASE_URL:http://localhost:8081}
